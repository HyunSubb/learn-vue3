<!doctype html>
<html lang="en">
  <head>
    <title>Hello Vue3</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <button type="button" v-on:click="counter++">Counter: {{ counter }}</button>
      <!-- {{}} 중괄호 2개로 감싼 것을 템플릿 문법이라고 한다. -->
    </div>
    <script>
      const app = Vue.createApp({
        data() {
          return {
            counter: 0,
            // 선언적 렌더링 : 데이터를 선언만 하고 템플릿 구문만 사용해주면 데이터를 자동으로 렌더링 해줌.
            // 반응형 동작 : 데이터가 변경되었을 때 자동으로 추적하고 효율적으로 업데이트를 함.
          };
        },
      });

      app.mount("#app");
    </script>
  </body>
</html>
